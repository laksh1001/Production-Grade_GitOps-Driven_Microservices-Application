apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: boutique-image-updater
  namespace: argocd
spec:
  namespace: argocd
  applicationRefs:
    - namePattern: "boutique-*"

      commonUpdateSettings:
        updateStrategy: "newest-build"
        allowTags: "regexp:^sha-[a-f0-9]{7,40}$"

      images:
        - alias: adservice
          imageName: lakshman1001/adservice

        - alias: cartservice
          imageName: lakshman1001/cartservice

        - alias: checkoutservice
          imageName: lakshman1001/checkoutservice

        - alias: currencyservice
          imageName: lakshman1001/currencyservice

        - alias: emailservice
          imageName: lakshman1001/emailservice

        - alias: frontend
          imageName: lakshman1001/frontend

        - alias: paymentservice
          imageName: lakshman1001/paymentservice

        - alias: productcatalogservice
          imageName: lakshman1001/productcatalogservice

        - alias: recommendationservice
          imageName: lakshman1001/recommendationservice

        - alias: shippingservice
          imageName: lakshman1001/shippingservice

        - alias: loadgenerator
          imageName: lakshman1001/loadgenerator

