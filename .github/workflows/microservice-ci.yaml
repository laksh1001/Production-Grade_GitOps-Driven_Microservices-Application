name: Microservice CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Locate Dockerfile and Context
        id: setup-build
        run: |
          if [ -f "./src/${{ inputs.service }}/src/Dockerfile" ]; then
            # Cartservice and subfolder-based builds: context must be ./src/<service>/src
            echo "file=./src/${{ inputs.service }}/src/Dockerfile" >> $GITHUB_OUTPUT
            echo "context=./src/${{ inputs.service }}/src" >> $GITHUB_OUTPUT
          elif [ -f "./src/${{ inputs.service }}/Dockerfile" ]; then
            echo "file=./src/${{ inputs.service }}/Dockerfile" >> $GITHUB_OUTPUT
            echo "context=./src/${{ inputs.service }}" >> $GITHUB_OUTPUT
          else
            FOUND_FILE=$(find "./src/${{ inputs.service }}" -name "Dockerfile" | head -n 1)
            echo "file=$FOUND_FILE" >> $GITHUB_OUTPUT
            echo "context=$(dirname "$FOUND_FILE")" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push with Buildx
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.setup-build.outputs.context }}
          file: ${{ steps.setup-build.outputs.file }}
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/microservices-demo/${{ inputs.service }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
